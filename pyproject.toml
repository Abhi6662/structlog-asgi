[tool.poetry]
name = "structlog-asgi"
version = "0.1.0"
description = "Structured JSON logging & X-Request-ID correlation middleware for FastAPI/ASGI"
authors = ["Abhishek Mandloi <163866821+Abhi6662@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Abhi6662/structlog-asgi"
repository = "https://github.com/Abhi6662/structlog-asgi"
keywords = ["fastapi", "logging", "observability", "asgi", "python", "structlog", "middleware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: System :: Logging",
]

[tool.poetry.dependencies]
python = "^3.10"
structlog = ">=23.1.0"
starlette = ">=0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
httpx = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
